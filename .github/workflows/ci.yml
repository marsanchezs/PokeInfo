name: Android CI

on:
  pull_request:
  push:
    branches: [ "develop", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 🔎 DETEKT (quality code)
      - name: Run Detekt
        run: ./gradlew detekt

      # 🧪 Unit tests
      - name: Run Unit Tests
        run: ./gradlew test

      # 📦 Build
      - name: Build Debug APK
        run: ./gradlew assembleDebug